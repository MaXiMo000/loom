[project]
name = "loom-backend"
version = "0.1.0"
description = "loom backend — FastAPI service resolving/scanning real dependency graphs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "toml>=0.10",
    "carabiner-sec>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["app*"]
